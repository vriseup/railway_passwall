services:
  railway-passwall:
    container_name: railway-passwall
    restart: unless-stopped
    image: railway-passwall:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ARGO_DOMAIN: ${DOMAIN}
      ARGO_AUTH: ${AUTH}
      TZ: ${TZ}
