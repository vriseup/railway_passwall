version: "3.3"

services:
  railway-passwall:
    container_name: railway-passwall
    restart: unless-stopped
    image: railway-passwall:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ARGO_DOMAIN: ${ARGO_DOMAIN:-${DOMAINS:-${DOMAIN:-}}}
      ARGO_AUTH: ${AUTH}
      ARGO_PORT: ${ARGO_PORT:-8001}
      DOMAINS: ${DOMAINS:-}
      IPS: ${IPS:-}
      PORTS: ${PORTS:-}
      MULTI_IP_MODE: ${MULTI_IP_MODE:-true}
      MULTI_IP_INCLUDE_PRIVATE: ${MULTI_IP_INCLUDE_PRIVATE:-false}
      TZ: Asia/Shanghai
